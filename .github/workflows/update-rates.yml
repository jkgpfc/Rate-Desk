name: Update rates

# Runs on a schedule, rebuilds data/rates.json, and commits it if anything moved.
# GitHub Pages republishes the site automatically, so the Rate Desk page picks
# up the new numbers on its next refresh.

on:
  schedule:
    # 03:30 UTC is 09:00 IST, and 12:30 UTC is 18:00 IST.
    # Cron on GitHub is always in UTC. Scheduled runs are best effort and can
    # be delayed by several minutes at busy times.
    - cron: "30 3 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to commit the refreshed file back

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the feed
        run: python3 scripts/update_rates.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data/rates.json)" ]; then
            echo "Nothing changed. Not committing."
            exit 0
          fi
          git config user.name  "rate-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "Update rates feed"
          git push
